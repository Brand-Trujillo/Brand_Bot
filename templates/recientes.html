<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Bot | Recientes</title>
  <link rel="icon" href="{{ url_for('favicon_ico') }}?v={{ app_version }}">
  <link rel="shortcut icon" href="{{ url_for('favicon_ico') }}?v={{ app_version }}">
  <link rel="apple-touch-icon" href="{{ url_for('favicon_ico') }}?v={{ app_version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <main class="layout">
    <section class="recent-shell" aria-label="Ultimas muestras registradas">
      <header class="brand recent-header">
        <div class="brand-dot" aria-hidden="true"></div>
        <div>
          <h1>Recientes</h1>
          <p>
            Ultimas muestras registradas (Lunes a Viernes).
            <span id="backend-version" class="version-badge">backend {{ app_version }}</span>
          </p>
        </div>
        <div class="brand-actions">
          <button id="refresh-btn" type="button" class="secondary-btn">Actualizar</button>
          <a class="secondary-btn" href="{{ url_for('index') }}">Volver al chat</a>
        </div>
      </header>

      <section class="recent-toolbar" aria-live="polite">
        <p id="recent-status">Cargando muestras recientes...</p>
      </section>

      <section id="recent-days" class="recent-days" aria-live="polite"></section>
    </section>
  </main>

  <script src="{{ url_for('static', filename='recientes.js') }}?v={{ app_version }}"></script>
</body>
</html>
