<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand Bot | Control de Muestras</title>
  <link rel="icon" href="{{ url_for('favicon_ico') }}?v={{ app_version }}">
  <link rel="shortcut icon" href="{{ url_for('favicon_ico') }}?v={{ app_version }}">
  <link rel="apple-touch-icon" href="{{ url_for('favicon_ico') }}?v={{ app_version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <main class="layout">
    <section class="chat-shell" aria-label="Chat del asistente">
      <header class="brand">
        <div class="brand-dot" aria-hidden="true"></div>
        <div>
          <h1>Brand_Bot</h1>
          <p>
            Asistente virtual de Brandon.
            <span id="backend-version" class="version-badge">backend {{ app_version }}</span>
          </p>
        </div>
        <div class="brand-actions">
          <a class="secondary-btn" href="{{ url_for('recientes') }}">RECIENTES</a>
          <a class="whatsapp-btn" href="https://wa.me/573123894917" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        </div>
      </header>

      <div id="chat" class="chat-feed" aria-live="polite">
        <article class="bubble bot">
          <h2>Asistente</h2>
          <p>Hola. Tengo conocimiento sobre muestras y equipos del laboratorio. Puedes preguntarme por cliente, referencia, marca, informe, cotización o estado de calibración</p>
        </article>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <label for="message" class="sr-only">Escribe tu pregunta</label>
        <input id="message" name="message" type="text" placeholder="Ejemplo: Muestra 21692" required>
        <button id="send-btn" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <a class="whatsapp-fab" href="https://wa.me/573123894917" target="_blank" rel="noopener noreferrer" aria-label="Abrir WhatsApp">WhatsApp</a>

  <script src="{{ url_for('static', filename='chat.js') }}?v={{ app_version }}"></script>
</body>
</html>
